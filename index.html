<!doctype html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>IsGame se ha mudado · isuniverse.dev/game/</title>
  <link rel="canonical" href="https://isuniverse.dev/game/">

  <script>location.replace(location.pathname.replace(/^\/isgame(?=\/|$)/, '/game') + location.search + location.hash);</script>
  <meta http-equiv="refresh" content="0; url=/game/">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #fbf7ef; color: #1c2547; text-align: center; }
    a { color: #7a5212; font-weight: 600; }
    @media (prefers-color-scheme: dark) { body { background: #0b1026; color: #f6f1e7; } a { color: #e2b25c; } }
  </style>
</head>
<body>
  <p>IsGame se ha mudado a <a href="/game/">isuniverse.dev/game/</a>.<br>
  <span lang="en">IsGame has moved to <a href="/game/?lang=en">isuniverse.dev/game/</a>.</span></p>
</body>
</html>
